name: Build - develop

on:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v3

      - name: Setup Dotnet Core
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '6.0.x'

      - name: Restore Web
        run: dotnet restore src/Cinnamon.Web/Cinnamon.Web.csproj
      
      - name: Restore Core
        run: dotnet restore src/Cinnamon.Core/Cinnamon.Core.csproj

      - name: Restore Data
        run: dotnet restore src/Cinnamon.Data/Cinnamon.Data.csproj
      
      - name: Build Project
        run: dotnet build src/Cinnamon.Web/Cinnamon.Web.csproj -c Release -o output/build

      - name: Publish Project
        run: dotnet publish src/Cinnamon.Web/Cinnamon.Web.csproj -c Release -o output/publish
      
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SERVER_SSH_KEY }} 
          known_hosts: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      
      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Run LS
        run: ls
      
      - name: Run LS in SSH
        run: ls ~/.ssh/

      - name: Run LS from DEV Server
        run: ssh cinnamon@${{ secrets.SERVER_IP }} "ls"
      
      - name: Copy Artifacts to DEV Server
        run: scp output/publish/ cinnamon@20.39.197.187:/home/cinnamon/test/from_github/

      - name: Save Artifact
        uses: actions/upload-artifact@v3
        with:
          name: dev-build
          path: output/publish/
      
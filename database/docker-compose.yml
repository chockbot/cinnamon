version: "3.1"
services:
  db:
    container_name: cinnamon_db
    image: postgres:14.5-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: CINNAMON
  
  pgadmin:
    container_name: cinnamon_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cinnamon.ph
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

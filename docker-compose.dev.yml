version: "3.1"
services:
  app:
    container_name: cinnamon_app_dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:80"
    networks: 
      - dev
  
  db:
    container_name: cinnamon_db_dev
    image: postgres:14.5-alpine
    restart: always
    networks:
      - dev
    volumes:
      - ./database/data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: CINNAMON

networks:
  dev:
    driver: bridge
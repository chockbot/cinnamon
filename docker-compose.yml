version: "3.1"
services:
  app:
    container_name: cinnamon_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks: 
      - internal
  
  db:
    container_name: cinnamon_db
    image: postgres:14.5-alpine
    networks:
      - internal
    volumes:
      - ./database/data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: CINNAMON

networks:
  internal:
    driver: bridge
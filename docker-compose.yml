version: "3.1"
services:
  app:
    container_name: cinnamon_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.prod
    environment:
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${SSL_PASSWORD}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/cinnamon.ph.pfx
    volumes:
      - ${SSL_FOLDER_PATH}:/https:ro
    networks: 
      - prod
  
  db:
    container_name: cinnamon_db
    image: postgres:14.5-alpine
    networks:
      - prod
    volumes:
      - ./database/data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: CINNAMON

networks:
  prod:
    driver: bridge
version: "3.1"
services:
  api-data:
    container_name: cinnamon_api_data_dev
    build:
      context: .
      dockerfile: Dockerfile.Data
    restart: always
    volumes:
      - ./src-data:/app
    networks:
      - dev

  api-core:
    container_name: cinnamon_api_core_dev
    build:
      context: .
      dockerfile: Dockerfile.Core
    restart: always
    ports:
      - "3001:80"
    volumes:
      - ./src-core:/app
      - ./src-web:/web-app
    networks:
      - dev

  app:
    container_name: cinnamon_app_dev
    build:
      context: .
      dockerfile: Dockerfile.Web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./src-web:/app
    networks:
      - dev

networks:
  dev:
    driver: bridge

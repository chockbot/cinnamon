version: "3.1"
services:
  api-data:
    container_name: cinnamon_api_data_dev
    build:
      context: .
      dockerfile: Dockerfile.Data
    restart: always
    volumes:
      - ./src-data:/app
    networks:
      - dev
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 100M
        reservations:
          cpus: "0.25"
          memory: 30M

  api-core:
    container_name: cinnamon_api_core_dev
    build:
      context: .
      dockerfile: Dockerfile.Core
    restart: always
    ports:
      - "3001:80"
    volumes:
      - ./src-core:/app
      - ./src-web:/web-app
    networks:
      - dev
    depends_on:
      - api-data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 100M
        reservations:
          cpus: "0.25"
          memory: 30M

  app:
    container_name: cinnamon_app_dev
    build:
      context: .
      dockerfile: Dockerfile.Web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./src-web:/app
    networks:
      - dev
    depends_on:
      - api-core
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 100M
        reservations:
          cpus: "0.25"
          memory: 30M

networks:
  dev:
    driver: bridge

version: "3.1"
services:
  api-data:
    container_name: cinnamon_api_data_prod
    build:
      context: .
      dockerfile: Dockerfile.Data
    restart: always
    volumes:
      - ./src-data:/app
    networks:
      - prod

  api-core:
    container_name: cinnamon_api_core_prod
    build:
      context: .
      dockerfile: Dockerfile.Core
    restart: always
    volumes:
      - ./src-core:/app
    networks:
      - prod

  app:
    container_name: cinnamon_app_prod
    build:
      context: .
      dockerfile: Dockerfile.Web
    restart: always
    ports:
      - "8081:80"
      - "443:443"
    env_file:
      - .env.prod
    environment:
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${SSL_PASSWORD}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/cinnamon.ph.pfx
    volumes:
      - ${SSL_FOLDER_PATH}:/https:ro
      - ./src-web:/app
    networks:
      - prod

networks:
  prod:
    driver: bridge

version: "3.1"
services:
  api-data:
    container_name: cinnamon_api_data_prod
    build:
      context: .
      dockerfile: Dockerfile.Data
    restart: always
    volumes:
      - ./src-data:/app
    networks:
      - prod

  api-core:
    container_name: cinnamon_api_core_prod
    build:
      context: .
      dockerfile: Dockerfile.Core
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./src-core:/app
      - ./src-web:/web-app
    networks:
      - prod

  app:
    container_name: cinnamon_app_prod
    build:
      context: .
      dockerfile: Dockerfile.Web
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./src-web:/app
    networks:
      - prod

networks:
  prod:
    driver: bridge

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <div style='
                font-size: 16px;
                border-radius: 5px;
                min-width: 300px;
                max-width: 700px;
                color: #545454;
                margin: 0 auto;
                margin-top: 3rem;
                border: 1px solid #343d4c;
                position: relative;
                background-color: #fffcf9;
         '>
        <div class='img-logo' style='padding-top: 1rem'>
            <img style='width: 200px; height: auto; margin: 0 auto; display: block'
                 src='https://stcinnamondev.blob.core.windows.net/assets/cinnamon-logo.png'
                 alt='logo' />
        </div>
        <div class='purchased-customer'
             style='padding: 1.5rem; padding-bottom: 0.5rem'>
            <p style='margin: 0; margin-top: 1rem; color: #ffa942; font-size: 20px'>
                Good day Admin,
            </p>
            <p style='margin: 0; font-size: 20px; color: #343d4c'>
                A user has requested verification with below details:
            </p>
        </div>
        <hr style='margin: 0; border: none; height: 1px; background-color: #d9d9d9' />
        <div class='purchased-details' style='padding: 2rem 2rem'>

            <table style='width: 100%'>
                <tbody>
                    <tr>
                        <td style='width: 50%'>
                            <p style='font-size: 16px; margin: 0; margin-top: 1rem'>
                                <span style='color: #717171'>User email: </span>
                            </p>
                        </td>
                        <td style='text-align: right; width: 50%'>
                            <p style='font-size: 16px; margin: 0; margin-top: 1rem'>
                                <span style='color: #343d4c;'>{Email}</span>
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style='width: 50%'>
                            <p style='font-size: 16px; margin: 0; margin-top: 1rem'>
                                <span style='color: #717171'>Has ID Attached:</span>
                            </p>
                        </td>
                        <td style='text-align: right; width: 50%'>
                            <p style='font-size: 16px; margin: 0; margin-top: 1rem'>
                                <span style='color: #343d4c;'>{IdAttached}</span>
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style='width: 50%'>
                            <p style='font-size: 16px; margin: 0; margin-top: 1rem'>
                                <span style='color: #717171'>Bank details populated:</span>
                            </p>
                        </td>
                        <td style='text-align: right; width: 50%'>
                            <p style='font-size: 16px; margin: 0; margin-top: 1rem'>
                                <span style='color: #343d4c;'>{BankDetails}</span>
                            </p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
